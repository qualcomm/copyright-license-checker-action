name: 'Run full-repository Copyright and license check'
description: 'A GitHub Action to scan every tracked source file (and license-optional build file) in a repository for copyright and license compliance'
inputs:
  repo_name:
    description: 'The name of the github repository (owner/repo)'
    required: true
  fail_on_findings:
    description: 'Fail the run when blocking issues are found. Defaults to false (report-only).'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install -r "$ACTION_PATH/requirements.txt"
      shell: bash

    - name: Run full-repo scan
      env:
        ACTION_PATH: ${{ github.action_path }}
        REPO_NAME: ${{ inputs.repo_name }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
      run: python "$ACTION_PATH/full_scan.py" -- "$REPO_NAME" "$FAIL_ON_FINDINGS"
      shell: bash

branding:
  icon: 'search'
  color: 'blue'
