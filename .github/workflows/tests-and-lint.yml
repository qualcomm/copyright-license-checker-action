name: Tests and Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lock:
    name: Verify runtime dependency lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"

      - name: Verify locked dependencies
        run: >-
          uv pip sync --system --dry-run --strict --require-hashes
          --only-binary=lxml requirements.lock

      - name: Check lock freshness
        run: |
          ./scripts/update-lock.sh
          if ! git diff --quiet -- requirements.lock; then
            echo "::warning file=requirements.lock::requirements.lock is stale; run ./scripts/update-lock.sh and review the changes"
          fi

  tox:
    name: Run tox
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"

      - name: Run tox
        run: uv tool run --python 3.12 --from tox==4.44.0 tox
