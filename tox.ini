[tox]
envlist = package, cover, black, flake8, pylint
isolated_build = true

# NOTE: requirements.lock is deliberately NOT installed here.
# scancode is only ever invoked as a CLI subprocess (never imported), so the
# test suite needs only pathspec. Installing scancode-toolkit would add
# hundreds of megabytes to every run for no benefit.
[testenv]
basepython = python3.12
skip_install = true
deps =
    pathspec==0.12.1
commands_pre =
    python -m pip install --no-deps {toxinidir}/dist/copyright_license_checker-2.0.1-py3-none-any.whl

[testenv:cover]
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m unittest discover -s tests -t .
    coverage report -m
    coverage html

[testenv:black]
deps = black
skip_install = true
commands_pre =
commands = black --check --diff main.py scanner src tests

[testenv:flake8]
deps = flake8
skip_install = true
commands_pre =
commands = flake8 main.py scanner src tests

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint
setenv =
    PYTHONPATH = {toxinidir}
commands = pylint main.py scanner src tests

[testenv:autoformat]
deps = {[testenv:black]deps}
skip_install = true
commands_pre =
commands = black main.py scanner src tests

[testenv:package]
description = Build distributions and smoke-test the installed console command.
skip_install = true
commands_pre =
deps =
    build==1.3.0
changedir = {envtmpdir}
commands =
    python -m build {toxinidir} --outdir {toxinidir}/dist
    python {toxinidir}/tests/package_artifacts.py
