[tox]
envlist = cover, black, flake8, pylint
isolated_build = true
skipsdist = true

# NOTE: requirements.txt is deliberately NOT installed here.
# scancode is only ever invoked as a CLI subprocess (never imported), so the
# tests mock subprocess.run and need nothing but pathspec. Installing
# scancode-toolkit would add hundreds of megabytes to every run for no benefit.
[testenv]
deps =
    pathspec==0.12.1
setenv =
    PYTHONPATH = {toxinidir}

[testenv:cover]
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m unittest discover -s tests -t .
    coverage report -m
    coverage html

[testenv:black]
deps = black
skip_install = true
commands = black --check --diff main.py scanner tests

[testenv:flake8]
deps = flake8
skip_install = true
commands = flake8 main.py scanner tests

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint
commands = pylint main.py scanner tests

[testenv:autoformat]
deps = {[testenv:black]deps}
skip_install = true
commands = black main.py scanner tests
