[tox]
envlist = cover
isolated_build = true
skipsdist = true

# NOTE: requirements.txt is deliberately NOT installed here.
# scancode is only ever invoked as a CLI subprocess (never imported), so the
# tests mock subprocess.run and need nothing but pathspec. Installing
# scancode-toolkit would add hundreds of megabytes to every run for no benefit.
[testenv]
deps =
    pathspec==0.12.1

[testenv:cover]
deps =
    {[testenv]deps}
    coverage
commands =
    coverage run -m unittest discover -s tests -t .
    coverage report -m
    coverage html
