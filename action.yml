name: 'Run Copyright and license check with Patch File'
description: 'A GitHub Action to run a Copyright and license checker with a patch file'
inputs:
  patch_file:
    description: 'The patch file to apply'
    required: true
    default: 'patch_file.patch'
  repo_name:
    description: 'The name of the github repository'
    required: true
  mode:
    description: "Compliance mode: 'opensource' or 'proprietary'"
    required: false
    default: 'opensource'
  proprietary_entities:
    description: >-
      Comma-separated copyright-holder strings, in addition to the built-in
      defaults, treated as internal authorship in proprietary mode
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        # Quoted so YAML cannot reinterpret the value as a number.
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: '0.11.16'

    - name: Prepare private environment
      id: prepare-private-environment
      env:
        ACTION_PATH: ${{ github.action_path }}
      # --only-binary=lxml: the lxml pin has a runner-compatible wheel, and its
      # sdist needs libxml2/libxslt development headers. Refuse sdists so a
      # packaging/platform mismatch fails fast instead of starting a C build.
      run: |
        VENV_PATH="$(mktemp -d "$RUNNER_TEMP/copyright-license-checker-action-XXXXXX")"
        uv venv --clear --python 3.12 "$VENV_PATH"
        uv pip sync --python "$VENV_PATH/bin/python" \
          --strict --require-hashes --only-binary=lxml \
          "$ACTION_PATH/requirements.lock"
        echo "venv_path=$VENV_PATH" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Run checker
      env:
        ACTION_PATH: ${{ github.action_path }}
        PATCH_FILE: ${{ inputs.patch_file }}
        REPO_NAME: ${{ inputs.repo_name }}
        MODE: ${{ inputs.mode }}
        PROPRIETARY_ENTITIES: ${{ inputs.proprietary_entities }}
        VENV_PATH: ${{ steps.prepare-private-environment.outputs.venv_path }}
      run: |
        PATH="$VENV_PATH/bin:$PATH" "$VENV_PATH/bin/python" "$ACTION_PATH/main.py" \
          "$PATCH_FILE" \
          "$REPO_NAME" \
          --mode "$MODE" \
          --proprietary-entities "$PROPRIETARY_ENTITIES"
      shell: bash

branding:
  icon: 'python'
  color: 'blue'
