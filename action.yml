name: 'Run Copyright and license check with Patch File'
description: 'A GitHub Action to run a Copyright and license checker with a patch file'
inputs:
  patch_file:
    description: 'The patch file to apply'
    required: true
    default: 'patch_file.patch'
  repo_name:
    description: 'The name of the github repository'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        # Quoted so YAML cannot reinterpret the value as a number.
        python-version: '3.12'

    - name: Install dependencies
      env:
        ACTION_PATH: ${{ github.action_path }}
      # --only-binary=lxml: scancode-toolkit depends on lxml, whose sdist needs
      # the libxml2/libxslt development headers that runners do not ship. Refuse
      # the sdist so a missing wheel fails fast and legibly instead of dying part
      # way through a C build.
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=lxml -r "$ACTION_PATH/requirements.txt"
      shell: bash

    - name: Run checker
      env:
        ACTION_PATH: ${{ github.action_path }}
        PATCH_FILE: ${{ inputs.patch_file }}
        REPO_NAME: ${{ inputs.repo_name }}
      run: python "$ACTION_PATH/main.py" "$PATCH_FILE" "$REPO_NAME"
      shell: bash

branding:
  icon: 'python'
  color: 'blue'
